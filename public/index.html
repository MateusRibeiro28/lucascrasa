<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Grupos</title><style>:root{color-scheme:dark}body{margin:0;background:#0e1922;color:#f2f8f6;font:15px system-ui}main{max-width:1170px;margin:0 auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:330px 1fr;gap:15px}.card{background:#1b2c37;border:1px solid #39515b;border-radius:15px;padding:19px}button{border:0;border-radius:9px;padding:12px 14px;background:#108b71;color:white;margin:4px;cursor:pointer}button:disabled{opacity:.5}.group{display:block;width:100%;text-align:left;background:#29444f}.msg{padding:11px;border-bottom:1px solid #41545e;overflow-wrap:anywhere}input{padding:12px;background:#182a34;color:white;border:1px solid #4b636d;border-radius:9px}#status,#diagnostic{white-space:pre-wrap;overflow-wrap:anywhere}#msgs{max-height:460px;overflow:auto}pre{white-space:pre-wrap;font:inherit}@media(max-width:720px){.grid{grid-template-columns:1fr}header{display:block}}</style><main><header><div><h1>Central de Grupos</h1><p>Evolution Cloudfy · PostgreSQL Neon · Resumos com IA</p></div><button id="sync" onclick="sync()">Sincronizar grupos</button></header><p><input type="password" id="password" placeholder="Senha do painel" autocomplete="off"><button onclick="login()">Entrar</button></p><p id="status">Digite a senha para consultar a Central.</p><pre id="diagnostic"></pre><div class="grid"><section class="card"><h3 id="counter">Grupos</h3><div id="groups"></div></section><section class="card"><h3 id="title">Selecione um grupo</h3><button onclick="importMsgs()">Importar histórico</button><button onclick="summarize()">Gerar resumo</button><div id="msgs"></div><pre id="summary"></pre></section></div></main><script>const E=id=>document.getElementById(id);let selected=null;async function api(name,options={}){const r=await fetch("/api/"+name,{cache:"no-store",...options,credentials:"same-origin",headers:{"Content-Type":"application/json"}}),d=await r.json();if(!r.ok)throw Error(d.error||"Erro da API");return d}async function login(){try{await api("login",{method:"POST",body:JSON.stringify({password:E("password").value})});E("password").value="";E("password").parentElement.style.display="none";const h=await api("health");E("status").textContent="Neon conectado · Evolution "+(h.evolutionConfigured?"configurada":"não configurada");await groups();scheduleSync()}catch(e){E("status").textContent=e.message}}async function groups(){const d=await api("groups");E("counter").textContent="Grupos ("+d.groups.length+")";E("groups").replaceChildren();for(const g of d.groups){const b=document.createElement("button");b.className="group";b.textContent=g.name+" · "+g.message_count+" mensagens";b.onclick=()=>show(g);E("groups").append(b)}}async function sync(){E("sync").disabled=true;E("status").textContent="Consultando grupos na Cloudfy. A operação pode demorar até 55 segundos...";E("diagnostic").textContent="";try{const d=await api("sync",{method:"POST"});await groups();E("status").textContent=d.instances+" instância(s), "+d.saved+" grupos encontrados";E("diagnostic").textContent=(d.report||[]).map(x=>x.instance+": "+x.groups+" grupos via "+x.source+" · "+x.seconds+"s\n"+(x.errors||[]).join("\n")).join("\n")+(d.partial?"\nHá outras instâncias; esta etapa validou a instância principal.":"")}catch(e){E("status").textContent="Erro ao sincronizar: "+e.message}finally{E("sync").disabled=false}}async function show(g){selected=g;E("title").textContent=g.name;E("summary").textContent="";await messages()}async function messages(){if(!selected)return;const d=await api("messages?instance="+encodeURIComponent(selected.instance)+"&jid="+encodeURIComponent(selected.jid));E("msgs").replaceChildren();for(const m of d.messages){const p=document.createElement("div");p.className="msg";p.textContent=(m.sender||"Participante")+": "+(m.body||"[mídia]");E("msgs").append(p)}if(!d.messages.length)E("msgs").textContent="Nenhuma mensagem importada. Use Importar histórico."}async function importMsgs(){if(!selected)return;try{E("status").textContent="Importando histórico...";const d=await api("import",{method:"POST",body:JSON.stringify(selected)});E("status").textContent=d.received+" mensagens consultadas, "+d.saved+" novas gravadas";await messages();await groups()}catch(e){E("status").textContent="Importação: "+e.message}}async function summarize(){if(!selected)return;E("summary").textContent="Gerando resumo...";try{const d=await api("summary",{method:"POST",body:JSON.stringify(selected)});E("summary").textContent=d.summary}catch(e){E("summary").textContent=e.message}}async function scheduleSync(){if(window.cgStarted)return;window.cgStarted=true;updateBatch();setInterval(()=>{if(document.visibilityState==="visible")updateBatch()},20000);setInterval(()=>{if(document.visibilityState==="visible"&&selected)messages()},40000);setInterval(()=>{if(document.visibilityState==="visible"&&selected)summarize()},180000)}
let inFlight=false;async function updateBatch(){if(inFlight)return;inFlight=true;try{let r=await api("batch",{method:"POST"});if(r.stats){E("counter").textContent="Grupos ("+r.stats.groups+") · "+r.stats.checked+" consultados · "+r.stats.messages+" mensagens"}await groups();if(selected)await messages();E("status").textContent=r.result.map(x=>x.error?"Histórico indisponível em um grupo":"Atualização: +"+x.saved+" mensagens").join(" | ")||"Atualização em andamento"}catch(e){E("status").textContent="Coleta: "+e.message}finally{inFlight=false}}
(async()=>{try{await api("health");E("password").parentElement.style.display="none";await groups();E("status").textContent="Sessão restaurada";scheduleSync()}catch{}})();</script></html>
